    post:
      tags: [Platform]
      summary: End an announcement now (operator only)
      description: >-
        Sets `endsAt` to now (a scheduled one also gets `startsAt` = now). Recorded as
        `announcement.end`; ending one that has already ended changes nothing and is not recorded.
      operationId: endPlatformAnnouncement
      security:
        - PlatformSession: []
      responses:
        '200':
          description: The ended announcement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAnnouncement'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such announcement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    IrisSession:
      type: apiKey
      in: cookie
      name: iris_session
    PlatformSession:
      type: apiKey
      in: cookie
      name: iris_platform_session
  responses:
    CrossOriginRequest:
      description: >-
        A state-changing request (not GET/HEAD/OPTIONS) whose `Origin` header is
        neither the API's own host nor in the CORS allow-list
        (`IRIS_ALLOWED_ORIGINS`). Applies to every such route. Body:
        `{"error":"Zahtev sa druge adrese nije dozvoljen."}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProcessesModuleDisabled:
      description: >-
        The organization has not enabled the "Procesi rada" module (Backoffice-controlled, off by default; it also
        counts as off while "Magacin" is off). Body: `{"error":"Modul „Procesi rada“ nije uključen za ovu organizaciju."}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StockModuleDisabled:
      description: >-
        The organization has not enabled the "Magacin" module (Backoffice-controlled, off by default).
        Body: `{"error":"Modul „Magacin“ nije uključen za ovu organizaciju."}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    CatalogCleanupKind:
      name: kind
      in: query
      required: true
      description: >-
        Which kinds of catalog item are in scope. Repeat the parameter
        (kind=service&kind=article) to sweep both at once. At least one is
        required.
      schema:
        type: array
        minItems: 1
        items:
          type: string
          enum: [service, article]
      style: form
      explode: true
    CatalogCleanupMissing:
      name: missing
      in: query
      required: true
      description: >-
        Which price has to be missing: `purchase` (no input price, regardless of
        the sale price), `sale` (no output price, regardless of the purchase
        price), or `both` (neither price set — the narrowest sweep).
      schema:
        type: string
        enum: [purchase, sale, both]
    WorkOrderSearch:
      name: search
      in: query
      description: >-
        Free-text search, case- and diacritic-insensitive (č/ć→c, š→s, ž→z,
        đ→dj), over order number, client, job description, operator,
        priority and document type (value and Serbian label), issue and due
        dates (YYYY-MM-DD and DD.MM.YYYY) and price (raw and "12.500,5 RSD").
      schema:
        type: string
    WorkOrderStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [new, assigned, inProgress, completed, cancelled, invoiced]
    WorkOrderAssignedTo:
      name: assignedTo
      in: query
      schema:
        type: string
    WorkOrderCustomerId:
      name: customerId
      in: query
      schema:
        type: string
    WorkOrderBillingDocumentType:
      name: billingDocumentType
      in: query
      schema:
        type: string
        example: invoice
    WorkOrderDeliveryMethod:
      name: deliveryMethod
      in: query
      schema:
        type: string
        example: pickup
    WorkOrderQueue:
      name: queue
      in: query
      description: >-
        Dashboard-style due-date bucket; each excludes cancelled orders.
        `unassigned` has no operator, `overdue` is due before `today` and not
        completed, `today` is due on `today`, `thisWeek` is due from `today`
        through `today` + 7 days. Unknown values are ignored.
      schema:
        type: string
        enum: [unassigned, overdue, today, thisWeek]
    WorkOrderToday:
      name: today
      in: query
      description: >-
        The caller's local date for the `queue` buckets; defaults to the
        server's UTC date. Malformed values are ignored.
      schema:
        type: string
        format: date
    WorkOrderDateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    WorkOrderDateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
    WorkOrderNeedsCostReview:
      name: needsCostReview
      in: query
      description: >-
        When `true`, returns only orders awaiting cost entry (the admin
        review queue). Admin-only — ignored for non-admin sessions.
      schema:
        type: boolean
    WorkOrderSort:
      name: sort
      in: query
      description: >-
        Sort field, `-` prefix for descending: `orderNumber` (natural, by the
        embedded numbers), `clientName`, `jobDescription`, `assignedTo`,
        `priority` (by rank low to urgent), `billingDocumentType`,
        `deliveryMethod`, `dueDate`, `price`, `status`, `issueDate`. Missing
        values sort last. Default `-issueDate`.
      schema:
        type: string
        example: -orderNumber
  schemas:
    ProcessNode:
      type: object
      required: [id, kind, label, x, y]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Client-generated, unique within the graph.
        kind:
          type: string
          enum: [step, input, product, byproduct]
        label:
          type: string
          minLength: 1
          maxLength: 120
        x:
          type: number
          description: Canvas position.
        y:
          type: number
        quantity:
          type: number
          minimum: 0
          description: Planned quantity. Item nodes only; dropped on steps.
        unit:
          type: string
          maxLength: 20
          description: Item nodes only; dropped on steps.
        catalogItemId:
          type: string
          description: >-
            Optional link to a catalog article. Item nodes only; dropped on steps. Must reference an existing
            article of the organization (services are rejected) on templates and work-order processes; an empty
            `unit` is filled from the article and a differing one is rejected (422). Linked nodes move warehouse
            stock automatically (see PUT /work-orders/{id}/process).
        note:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/ProcessStepStatus'
        actualQuantity:
          type: number
          minimum: 0
          description: Per-order state. Item nodes only; stripped from templates.
    ProcessStepStatus:
      type: string
      enum: [pending, in_progress, done, skipped]
      description: Per-order state of a step node; dropped on item nodes and stripped from templates.
    ProcessEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        source:
          type: string
          description: Id of an existing node.
        target:
          type: string
          description: Id of an existing node.
        label:
          type: string
          maxLength: 60
    ProcessGraph:
      type: object
      description: >-
        Directed acyclic graph of 1-200 nodes (at least one `step`) and 0-400
        edges. Allowed connections are input to step, step to step, step to
        product, step to byproduct, product to step and byproduct to step; edges
        may not be self-loops or duplicate a (source, target) pair.
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ProcessNode'
        edges:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/ProcessEdge'
    ProcessTemplate:
      type: object
      required: [id, name, description, isDefault, graph, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        graph:
          $ref: '#/components/schemas/ProcessGraph'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProcessTemplateInput:
      type: object
      required: [name, graph]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Unique per organization (case-sensitive).
        description:
          type: string
        isDefault:
          type: boolean
        graph:
          $ref: '#/components/schemas/ProcessGraph'
    WorkOrderProcess:
      type: object
      required: [workOrderId, templateId, templateName, graph, updatedAt, updatedBy]
      properties:
        workOrderId:
          type: string
        templateId:
          type: [string, 'null']
          description: Null once the template it was copied from is deleted.
        templateName:
          type: string
          description: Template name at the time it was applied.
        graph:
          $ref: '#/components/schemas/ProcessGraph'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          description: Username of the last editor.
    WorkOrderProcessInput:
      type: object
      required: [graph]
      properties:
        graph:
          $ref: '#/components/schemas/ProcessGraph'
    ApplyProcessTemplateInput:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: string
    DashboardData:
      type: object
      required:
        - hasOrders
        - summary
        - monthlyBuckets
        - deliveryDistribution
        - topClients
        - finance
        - signalCounts
        - clientAttentionRows
        - internalAttentionRows
        - queueSummary
        - operatorQueue
      properties:
        hasOrders:
          type: boolean
          description: Whether the tenant has any work order at all, ignoring filters.
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        monthlyBuckets:
          type: array
          description: Per issueDate month, chronological (filtered orders).
          items:
            $ref: '#/components/schemas/DashboardMonthlyBucket'
        deliveryDistribution:
          type: array
          description: Per delivery method, count descending (filtered orders).
          items:
            $ref: '#/components/schemas/DashboardDeliveryCount'
        topClients:
          type: array
          description: Top 10 clients by order count (filtered orders).
          items:
            $ref: '#/components/schemas/DashboardClientCount'
        finance:
          description: Admin-only; null for every other role.
          oneOf:
            - $ref: '#/components/schemas/DashboardFinance'
            - type: 'null'
        signalCounts:
          $ref: '#/components/schemas/DashboardSignalCounts'
        clientAttentionRows:
          type: array
          description: Rows for overdue / dueToday / dueThisWeek signals (all orders).
          items:
            $ref: '#/components/schemas/DashboardAttentionRow'
        internalAttentionRows:
          type: array
          description: Rows for the unassigned signal (all orders).
          items:
            $ref: '#/components/schemas/DashboardAttentionRow'
        queueSummary:
          $ref: '#/components/schemas/DashboardQueueSummary'
        operatorQueue:
          $ref: '#/components/schemas/DashboardOperatorQueue'
    DashboardSummary:
      type: object
      required: [totalOrders, statusCounts, totalRevenue]
      properties:
        totalOrders:
          type: integer
        statusCounts:
          type: object
          description: Every canonical status key is present (0 by default).
          required: [new, assigned, inProgress, completed, invoiced, cancelled]
          properties:
            new: {type: integer}
            assigned: {type: integer}
            inProgress: {type: integer}
            completed: {type: integer}
            invoiced: {type: integer}
            cancelled: {type: integer}
        totalRevenue:
          type: number
          format: double
          description: Sum of order `price` where it is set.
    DashboardMonthlyBucket:
      type: object
      required: [month, count, revenue]
      properties:
        month:
          type: string
          example: 2026-05
        count:
          type: integer
        revenue:
          type: number
          format: double
    DashboardDeliveryCount:
      type: object
      required: [method, count]
      properties:
        method:
          type: string
          example: postExpress
        count:
          type: integer
    DashboardClientCount:
      type: object
      required: [clientName, count]
      properties:
        clientName:
          type: string
        count:
          type: integer
    DashboardFinance:
      type: object
      required: [profitTotals, revenue, monthlyProfit, companyProfit, itemProfit]
      properties:
        profitTotals:
          $ref: '#/components/schemas/DashboardProfitTotals'
        revenue:
          type: number
          format: double
          description: Line-item sale revenue (unitPrice * quantity) of filtered orders.
        monthlyProfit:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMonthlyProfit'
        companyProfit:
          type: array
          description: All companies, profit descending.
          items:
            $ref: '#/components/schemas/DashboardCompanyProfit'
        itemProfit:
          $ref: '#/components/schemas/DashboardItemProfitBreakdown'
    DashboardProfitTotals:
      type: object
      required: [service, article, total]
      properties:
        service: {type: number, format: double}
        article: {type: number, format: double}
        total: {type: number, format: double}
    DashboardMonthlyProfit:
      type: object
      required: [month, service, article, total]
      properties:
        month: {type: string, example: 2026-05}
        service: {type: number, format: double}
        article: {type: number, format: double}
        total: {type: number, format: double}
    DashboardCompanyProfit:
      type: object
      required: [groupKey, customerId, name, profit, serviceProfit, articleProfit, revenue, orderCount]
      properties:
        groupKey: {type: string}
        customerId: {type: [string, 'null']}
        name: {type: string}
        profit: {type: number, format: double}
        serviceProfit: {type: number, format: double}
        articleProfit: {type: number, format: double}
        revenue: {type: number, format: double}
        orderCount: {type: integer}
    DashboardItemProfit:
      type: object
      required: [groupKey, catalogItemId, name, kind, profit, revenue, quantity]
      properties:
        groupKey: {type: string}
        catalogItemId: {type: [string, 'null']}
        name: {type: string}
        kind:
          type: string
          enum: [service, goods]
        profit: {type: number, format: double}
        revenue: {type: number, format: double}
        quantity: {type: number, format: double}
    DashboardItemProfitBreakdown:
      type: object
      required: [services, articles]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/DashboardItemProfit'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/DashboardItemProfit'
    DashboardSignalCounts:
      type: object
      required: [overdue, dueToday, dueThisWeek, unassigned]
      properties:
        overdue: {type: integer}
        dueToday: {type: integer}
        dueThisWeek: {type: integer}
        unassigned: {type: integer}
    DashboardAttentionOrder:
      type: object
      required: [id, orderNumber, jobDescription, status, dueDate]
      properties:
        id: {type: string}
        orderNumber: {type: string}
        jobDescription: {type: string}
        status:
          type: string
          enum: [new, assigned, inProgress, completed, cancelled, invoiced]
        dueDate:
          type: [string, 'null']
          format: date
    DashboardAttentionRow:
      type: object
      required: [groupKey, customerId, displayName, counts, severity, orders]
      properties:
        groupKey: {type: string}
        customerId: {type: [string, 'null']}
        displayName: {type: string}
        counts:
          $ref: '#/components/schemas/DashboardSignalCounts'
        severity:
          type: number
          format: double
          description: Highest signal severity plus total signal count / 100.
        orders:
          type: array
          description: Full list, most severe first then by order number.
          items:
            $ref: '#/components/schemas/DashboardAttentionOrder'
    DashboardQueueSummary:
      type: object
      required: [today, overdue, unassigned]
      properties:
        today: {type: integer}
        overdue: {type: integer}
        unassigned: {type: integer}
    DashboardOperatorQueue:
      type: object
      required: [assignedToMe, dueToday, overdue, inProgress, available]
      properties:
        assignedToMe: {type: integer}
        dueToday: {type: integer}
        overdue: {type: integer}
        inProgress: {type: integer}
        available: {type: integer}
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    LoginRequest:
      type: object
      required: [orgSlug, username, password]
      properties:
        orgSlug:
          type: string
          description: Organization (tenant) slug the account belongs to.
          example: grafika-cobanovic
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin123
        remember:
          type: boolean
          default: false
          description: >-
            Stay signed in on this device ("Zapamti me na ovom uređaju"):
            persistent cookie, 7 days idle and 30 days at most, instead of a
            browser-session cookie with 12 h idle and 24 h at most.
    LoginResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        error:
          type: string
          example: Neispravna organizacija, korisničko ime ili lozinka.
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          example: '1'
        username:
          type: string
          example: admin
        role:
          type: string
          enum: [admin, user]
        impersonatedBy:
          type: string
          description: >
            Present only on a session a Backoffice superadmin opened as this
            user; the superadmin's username.
    CreateUserInput:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
    UpdateUserInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, user]
        password:
          type: string
          description: When non-empty, resets the password (min 6 chars). Empty leaves it unchanged.
    JobDetails:
      type: object
      required: [productCode, paperWeightGsm, dimensions, quantity, finishingNote]
      properties:
        productCode:
          type: [string, 'null']
          example: CAT-42
        paperWeightGsm:
          type: [integer, 'null']
          example: 170
        dimensions:
          type: [string, 'null']
          example: A4
        quantity:
          type: [integer, 'null']
          example: 500
        finishingNote:
          type: [string, 'null']
          example: Mat plastifikacija
    Shipping:
      type: object
      required:
        [deliveryMethod, hasPackaging, hasLabeling, isFragile, requiresSignature, hasInsurance, shippingAddress]
      properties:
        deliveryMethod:
          type: [string, 'null']
          enum: [pickup, postExpress, cityExpress, fieldVisit, null]
          example: postExpress
        hasPackaging:
          type: boolean
        hasLabeling:
          type: boolean
        isFragile:
          type: boolean
        requiresSignature:
          type: boolean
        hasInsurance:
          type: boolean
        shippingAddress:
          type: [string, 'null']
          example: Bulevar 1
    Customer:
      type: object
      required: [id, name, contactName, email, phone, pib, mb, emails, contacts]
      properties:
        id:
          type: string
        name:
          type: string
        contactName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        emails:
          type: array
          description: >-
            Corporate email addresses for the firm. Replaces the single legacy
            `email` field, which is retained for back-compat.
          items:
            $ref: '#/components/schemas/CustomerEmail'
        contacts:
          type: array
          description: >-
            Contact people at the firm, each with their own optional email and
            phone. Replaces the single legacy `contactName`/`phone` fields.
          items:
            $ref: '#/components/schemas/CustomerContact'
        pib:
          type: [string, 'null']
          description: >-
            Serbian tax identification number (poreski identifikacioni broj):
            9 digits with an ISO 7064 MOD 11,10 control digit. Optional on
            imported records; validated by the server whenever non-empty.
          example: '100197914'
        mb:
          type: [string, 'null']
          description: >-
            Serbian company registration number (matični broj): exactly 8 digits.
            Optional on imported records; validated as format only.
          example: '53671888'
    CustomerEmail:
      type: object
      required: [id, email, label, sortOrder]
      properties:
        id:
          type: string
        email:
          type: string
        label:
          type: [string, 'null']
          description: Optional free-text tag, e.g. "Računovodstvo".
        sortOrder:
          type: integer
    CustomerContact:
      type: object
      required: [id, name, email, phone, role, sortOrder]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        role:
          type: [string, 'null']
          description: Optional job title or role of the contact person.
        sortOrder:
          type: integer
    Location:
      type: object
      required: [id, customerId, name, address]
      properties:
        id:
          type: string
        customerId:
          type: string
        name:
          type: string
        address:
          type: [string, 'null']
    Assignment:
      type: object
      required: [assignedTo, priority]
      properties:
        assignedTo:
          type: [string, 'null']
        priority:
          type: string
          enum: [low, normal, high, urgent]
    WorkOrderNote:
      type: object
      required: [id, visibility, author, body, createdAt]
      properties:
        id:
          type: string
        visibility:
          type: string
          enum: [internal, customer]
        author:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkOrderEvent:
      type: object
      required: [id, kind, label, actor, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
        label:
          type: string
        actor:
          type: string
        createdAt:
          type: string
          format: date-time
    Attachment:
      type: object
      required: [id, fileName, fileType, url, uploadedAt]
      properties:
        id:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        url:
          type: [string, 'null']
        uploadedAt:
          type: string
          format: date-time
    InvoiceDraft:
      type: object
      required: [status, invoiceNumber, lineItems, paidAt]
      properties:
        status:
          type: string
          enum: [none, draft, issued, paid]
        invoiceNumber:
          type: [string, 'null']
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        paidAt:
          type: [string, 'null']
          format: date
    InvoiceLineItem:
      type: object
      required: [id, kind, description, quantity, unit, unitPrice]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [service, goods]
        description:
          type: string
        quantity:
          type: number
          format: double
          description: >-
            Line-item quantity. Fractional values are allowed so services billed
            by area or length (e.g. 1.5 m² of tarpaulin) can be entered directly.
        unit:
          type: string
          description: >-
            Invoice line-item unit of measure. The built-in values are
            `kom`, `m2`, and `set`; administrators may add custom units via the
            `invoiceUnit` managed enum (see GET /enum-values), so any
            non-empty string the server recognizes is accepted.
          example: kom
        unitPrice:
          type: number
          format: double
        unitCost:
          type: [number, 'null']
          format: double
          description: >-
            Per-unit cost frozen onto the line at save time: for catalog lines the
            catalog cost in effect at the issue date (re-snapshot to the completion
            date when the order completes); for ad-hoc lines a value an admin
            enters by hand. Null means the cost is not yet captured (an ad-hoc line
            awaiting admin review, or an item with no known cost) — distinct from a
            genuine 0. Margin = unitPrice - unitCost. Admin-only: returned as null
            to non-admin users.
        catalogItemId:
          type: [string, 'null']
          description: >-
            Links the line back to the CatalogItem the user selected. Null for
            ad-hoc ("special") services typed inline that are not in the catalog.
    CatalogItem:
      type: object
      required: [id, code, name, kind, unit, salePrice, barcode, taxGroup, description, isActive]
      properties:
        id:
          type: string
        code:
          type: string
          description: Stable item code (legacy SIFRA on imported rows).
        name:
          type: string
        kind:
          type: string
          enum: [service, article]
        unit:
          type: string
          description: Unit of measure, lowercased (e.g. kom, set, m2, tab, ris).
          example: kom
        purchasePrice:
          type: [number, 'null']
          format: double
          description: >-
            Cost figure: purchase price (nabavna cena) for articles, cost of
            labor (cena rada) for services. Admin-only — the API returns null
            for non-admin users so operators never see cost or margin data.
        salePrice:
          type: [number, 'null']
          format: double
          description: Sale price charged to the customer (prodajna cena).
        barcode:
          type: [string, 'null']
        taxGroup:
          type: [string, 'null']
          description: >-
            PDV type code: "DJ" (general 20% rate, fiscal label Đ; the
            default), "E" (special 10% rate) or "A" (exempt). Empty input is
            and "Đ" are stored as "DJ"; other legacy codes are kept and priced at 20%.
        description:
          type: [string, 'null']
        isActive:
          type: boolean
        stockOnHand:
          type: [number, 'null']
          format: double
          description: >-
            Warehouse balance (sum of the article's stock movements). Read-only; null for services, and null for
            every item while the organization's "Magacin" module is off.
        minStock:
          type: [number, 'null']
          format: double
          minimum: 0
          description: Reorder threshold for articles; null when unset and for services.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CatalogItemCost:
      type: object
      required: [id, catalogItemId, effectiveFrom, createdAt]
      description: >-
        One effective-dated cost record in a catalog item's price history. A null
        effectiveTo marks the currently-effective record.
      properties:
        id:
          type: string
        catalogItemId:
          type: string
        purchasePrice:
          type: [number, 'null']
          format: double
        salePrice:
          type: [number, 'null']
          format: double
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        createdAt:
          type: string
          format: date-time
    PDFSections:
      type: object
      description: >-
        Which optional sections of the work-order printout are rendered. Every
        field defaults to true for an unconfigured shop. The napomena (notes)
        box is not listed here: it always renders, because the form always
        offers a napomena field to fill it.
      required: [delivery, billing, shippingAddress, completion, signatures]
      properties:
        delivery:
          type: boolean
          description: The delivery-method / postage checklist box.
        billing:
          type: boolean
          description: The billing-document box (invoice / cash collection / proforma).
        shippingAddress:
          type: boolean
          description: The shipping-address box.
        completion:
          type: boolean
          description: The completion state + date row.
        signatures:
          type: boolean
          description: The issuer / executor signature lines.
    BillingDefaults:
      type: object
      description: >-
        Controls the work-order document type (tip dokumenta): the value new
        orders start with. The type is always changeable per order; defaults to
        proforma for an unconfigured shop.
      required: [documentType]
      properties:
        documentType:
          type: string
          enum: [invoice, cashCollection, proforma]
          description: The document type new work orders start with.
    PriorityDefaults:
      type: object
      description: >-
        Controls the work-order priority (prioritet): the value new orders start
        with and whether it may be changed per order. Defaults to normal, not
        overridable, for an unconfigured shop.
      required: [priority, allowOverride]
      properties:
        priority:
          type: string
          enum: [low, normal, high, urgent]
          description: The priority new work orders start with.
        allowOverride:
          type: boolean
          description: >-
            When false, clients hide the priority picker and always use priority.
    PrintItemColumns:
      type: array
      description: >-
        Left-to-right order of the numeric columns in the work-order printout's
        "stavke" (line items) table. The item name always leads the row, so only
        these three are reorderable. Must be an exact permutation of all three
        values; duplicates and omissions are rejected.
      items:
        type: string
        enum: [quantity, unitPrice, total]
      minItems: 3
      maxItems: 3
      example: [quantity, unitPrice, total]
    OrganizationSettings:
      type: object
      required: [firmName, pdfSections, billingDefaults, priorityDefaults, printItemColumns, showShippingOptions, modules]
      properties:
        modules:
          readOnly: true
          description: >-
            Backoffice-controlled optional modules. Read-only: `PUT /settings` ignores it.
          $ref: '#/components/schemas/OrganizationModules'
        firmName:
          type: string
          description: The shop's display name shown in the app branding.
          example: Grafika Čobanović
        pdfSections:
          $ref: '#/components/schemas/PDFSections'
        billingDefaults:
          $ref: '#/components/schemas/BillingDefaults'
        priorityDefaults:
          $ref: '#/components/schemas/PriorityDefaults'
        printItemColumns:
          $ref: '#/components/schemas/PrintItemColumns'
        showShippingOptions:
          type: boolean
          description: >-
            Whether the work-order form exposes the extra shipping/handling
            fields (drives-out, wait-for-payment, packaging, labeling, fragile,
            signature, insurance). Off by default.
    OrganizationModules:
      type: object
      required: [processes, stock]
      description: >-
        Optional per-organization modules, both off by default and switched only by Backoffice superadmins
        (`PUT /platform/tenants/{slug}/modules`); organization admins cannot change them. `processes`
        ("Procesi rada": process templates, work-order processes, simulator) requires `stock` ("Magacin":
        stock ledger, receipts, counts, catalog stock). Valid combinations: both off, stock only, both on;
        `processes` is treated as off while `stock` is off. Processes and work-order stock postings are linked:
        a work-order process posts/validates stock only while `stock` is on AND the process was created while
        `stock` was on (internal "stock tracked" marker, no retroactive posting). Switching stock off and on
        again resumes tracked processes; their next save posts the difference.
      properties:
        processes:
          type: boolean
        stock:
          type: boolean
    OrganizationSettingsUpdate:
      type: object
      description: >-
        Partial update for organization settings. Omitted fields are left
        unchanged. A `modules` property, if sent, is ignored (only Backoffice
        superadmins switch modules).
      properties:
        firmName:
          type: string
          description: The shop's display name shown in the app branding.
        pdfSections:
          $ref: '#/components/schemas/PDFSections'
        billingDefaults:
          $ref: '#/components/schemas/BillingDefaults'
        priorityDefaults:
          $ref: '#/components/schemas/PriorityDefaults'
        printItemColumns:
          $ref: '#/components/schemas/PrintItemColumns'
        showShippingOptions:
          type: boolean
          description: Whether the work-order form exposes extra shipping/handling fields.
    CatalogItemInput:
      type: object
      required: [name, kind, unit]
      properties:
        code:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [service, article]
        unit:
          type: string
          example: kom
        purchasePrice:
          type: [number, 'null']
          format: double
          description: Cost (nabavna cena / cena rada). Admin-only.
        salePrice:
          type: [number, 'null']
          format: double
          description: Sale price (prodajna cena).
        barcode:
          type: [string, 'null']
        taxGroup:
          type: [string, 'null']
          description: >-
            PDV type code: "DJ" (general 20% rate, fiscal label Đ; the
            default), "E" (special 10% rate) or "A" (exempt). Empty input is
            and "Đ" are stored as "DJ"; other legacy codes are kept and priced at 20%.
        description:
          type: [string, 'null']
        isActive:
          type: boolean
        minStock:
          type: [number, 'null']
          format: double
          minimum: 0
          description: >-
            Reorder threshold, 0 or more (admin only; operators cannot change it). Articles only: ignored for
            services. Omitted or null clears it, like every other field of this full update.
        effectiveFrom:
          type: [string, 'null']
          format: date
          description: >-
            Date (YYYY-MM-DD) a changed price takes effect. Optional; defaults to
            today. Must be today or later — past dates are rejected. A future date
            schedules the new price without changing the item's displayed current
            price until that date arrives.
    StockLevel:
      type: object
      required: [catalogItemId, code, name, unit, isActive, onHand, reserved, available, minStock, low, lastMovementAt]
      properties:
        catalogItemId:
          type: string
        code:
          type: string
        name:
          type: string
        unit:
          type: string
        isActive:
          type: boolean
        onHand:
          type: number
          description: Sum of the article's movements; may be negative.
        reserved:
          type: number
          description: Planned input quantity still to be consumed by open work orders.
        available:
          type: number
          description: onHand minus reserved.
        minStock:
          type: [number, 'null']
        low:
          type: boolean
          description: onHand is negative, or minStock is set and available is below it.
        lastMovementAt:
          type: [string, 'null']
          format: date-time
    StockLevelList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockLevel'
        total:
          type: integer
          description: Number of matching levels before pagination.
    StockMovementKind:
      type: string
      enum: [opening, receipt, consumption, production, adjustment]
    StockMovement:
      type: object
      required: [id, catalogItemId, itemCode, itemName, unit, kind, quantity, workOrderId, workOrderNumber, processNodeId, documentRef, note, createdAt, createdBy]
      properties:
        id:
          type: string
        catalogItemId:
          type: string
        itemCode:
          type: string
        itemName:
          type: string
        unit:
          type: string
        kind:
          $ref: '#/components/schemas/StockMovementKind'
        quantity:
          type: number
          description: Signed; negative removes stock.
        workOrderId:
          type: [string, 'null']
          description: Null for manual movements and after the work order was deleted.
        workOrderNumber:
          type: [string, 'null']
        processNodeId:
          type: [string, 'null']
        documentRef:
          type: [string, 'null']
        note:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
    StockMovementList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        total:
          type: integer
    StockReceiptInput:
      type: object
      required: [lines]
      properties:
        documentRef:
          type: string
          maxLength: 500
          description: Supplier document number.
        note:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [catalogItemId, quantity]
            properties:
              catalogItemId:
                type: string
              quantity:
                type: number
                exclusiveMinimum: 0
    StockCountInput:
      type: object
      required: [lines]
      properties:
        note:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [catalogItemId, countedQuantity]
            properties:
              catalogItemId:
                type: string
              countedQuantity:
                type: number
                minimum: 0
    StockPostingResult:
      type: object
      required: [movements]
      properties:
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
    CustomerCommunication:
      type: object
      required: [publicToken, notificationEmail, emailNotificationsEnabled, signedBy, signedAt]
      properties:
        publicToken:
          type: string
        notificationEmail:
          type: [string, 'null']
        emailNotificationsEnabled:
          type: boolean
        signedBy:
          type: [string, 'null']
        signedAt:
          type: [string, 'null']
          format: date-time
    WorkOrder:
      type: object
      required:
        [id, orderNumber, customerId, locationId, clientName, contactPerson, jobDescription, jobDetails, billingDocumentType, billingDocumentNumber, shipping, issuedBy, executedBy, assignment, issueDate, proformaDueDate, dueDate, isCompleted, isPaid, status, price, note, createdAt, updatedAt, completionDate, internalNotes, customerNotes, events, attachments, materialUsage, timeEntries, invoiceDraft, communication]
      properties:
        id:
          type: string
          example: '42'
        orderNumber:
          type: string
          example: RN-2025-00042
        customerId:
          type: [string, 'null']
        locationId:
          type: [string, 'null']
        clientName:
          type: string
          example: Demo Klijent
        contactPerson:
          type: [string, 'null']
          example: Milica
        jobDescription:
          type: string
          example: Štampa kataloga
        jobDetails:
          anyOf:
            - $ref: '#/components/schemas/JobDetails'
            - type: 'null'
        billingDocumentType:
          type: [string, 'null']
          enum: [invoice, cashCollection, proforma, null]
          example: invoice
        billingDocumentNumber:
          type: [string, 'null']
          example: INV-42
        shipping:
          $ref: '#/components/schemas/Shipping'
        issuedBy:
          type: string
          example: admin
        executedBy:
          type: [string, 'null']
          example: pera
        assignment:
          $ref: '#/components/schemas/Assignment'
        issueDate:
          type: string
          format: date
          example: '2025-04-07'
        proformaDueDate:
          type: [string, 'null']
          format: date
          description: Deadline to issue the proforma invoice (predračun).
          example: '2025-04-10'
        dueDate:
          type: [string, 'null']
          format: date
          description: Deadline to finish the job.
          example: '2025-04-14'
        isCompleted:
          type: boolean
        isPaid:
          type: boolean
          description: >-
            Whether the job has been paid for (plaćeno). Independent of
            billingDocumentType: a proforma or cash-collection order can be
            paid just as an invoiced one can. Printed as its own ticked row in
            the nalog's document box.
        status:
          type: string
          enum: [new, assigned, inProgress, completed, cancelled, invoiced]
          example: inProgress
        price:
          type: [number, 'null']
          format: double
          example: 12000.5
        profit:
          type: [number, 'null']
          format: double
          description: >-
            Cached margin (sum of (unitPrice - unitCost) * quantity over line
            items with a captured cost), recomputed on every save. Provisional
            while needsCostReview is true. Admin-only — omitted/null for non-admin
            users.
          example: 4200
        needsCostReview:
          type: boolean
          description: >-
            True when any line item has no captured cost (unitCost null) — usually
            ad-hoc lines an operator added. Such orders are not blocked: they save,
            raise a cost_review event, and appear in the admin review queue
            (GET /work-orders?needsCostReview=true) until an admin enters the
            missing costs. Admin-only — returned false to non-admin users.
          example: false
        note:
          type: [string, 'null']
          example: Hitno
        createdAt:
          type: string
          format: date-time
          example: '2025-04-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-04-02T10:00:00Z'
        completionDate:
          type: [string, 'null']
          format: date
          example: '2025-04-05'
        internalNotes:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderNote'
        customerNotes:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderNote'
        events:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderEvent'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        materialUsage:
          type: array
          items:
            type: object
        timeEntries:
          type: array
          items:
            type: object
        invoiceDraft:
          $ref: '#/components/schemas/InvoiceDraft'
        communication:
          $ref: '#/components/schemas/CustomerCommunication'
    WorkOrderListResponse:
      type: object
      required: [items, total]
      properties:
