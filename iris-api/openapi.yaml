  /work-orders/{id}/process:
    get:
      tags: [Processes]
      summary: Get a work order's process
      operationId: getWorkOrderProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '403':
          $ref: '#/components/responses/ProcessesModuleDisabled'
        '200':
          description: The work-order process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderProcess'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work order not found, or it has no process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Processes]
      summary: Attach a copy of a process template to a work order
      description: >-
        Copies the template graph with every step set to `pending`. Any signed-in user may do this once per work order. Stock is reconciled as for the PUT (a no-op for a fresh copy, since nothing is done yet). The copy is marked stock tracked only when the "Magacin" module is on. POST /work-orders auto-attaches the default template under the same rule, and only while the "Procesi rada" module is on.
      operationId: applyProcessTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyProcessTemplateInput'
      responses:
        '403':
          $ref: '#/components/responses/ProcessesModuleDisabled'
        '201':
          description: The new work-order process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderProcess'
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work order or template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The work order already has a process (`Radni nalog već ima proces.`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: templateId missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Processes]
      summary: Replace a work order's process graph
      description: >-
        Admins may change anything. Other users may change only per-order state (status, actualQuantity, note) and node positions (x, y); any change to the node set, kind, label, quantity, unit, catalogItemId or the edge set (labels included) is rejected with 403. Step nodes without a status become `pending`.


        **Automatic stock posting.** In the same transaction the server reconciles the warehouse ledger with the graph (only item nodes whose `catalogItemId` links an article). The desired net per node is `+qty` when a step that outputs a product/byproduct node is `done`, plus `-qty` when any step the node feeds (input, or a product/byproduct consumed as input) is `done`; an intermediate product produced and consumed nets out. `qty` is `actualQuantity`, else `quantity`, else 0; `pending`, `in_progress` and `skipped` count as not done. The difference to the net already posted for that work order and node is inserted as one `consumption` (negative) or `production` (positive) movement, so repeating a request posts nothing, un-doing a step reverses it and a changed `actualQuantity` posts only the delta. If a node's article changes (or the node is removed), the old article's net is reversed and the new one posted. Deleting a process or a work order does not reverse movements.

        **Module gating.** Posting happens only while the "Magacin" module is on AND the process is stock tracked (created while "Magacin" was on - by apply or auto-attach; processes created while it was off never post, not even after it is switched on). While "Magacin" is off nothing is posted and article links are neither validated nor unit-filled (kept as-is). Turning it off and on again resumes tracked processes: the next save posts the difference (material really used meanwhile). Reserved quantities in GET /stock count tracked processes only. All routes here answer 403 while "Procesi rada" is off.


        **Article links.** `catalogItemId` must reference an existing article of the organization (`Artikal nije pronađen u katalogu.`, 422). An empty `unit` is filled from the article; a differing non-empty unit (case-insensitive) is rejected (`Jedinica mora odgovarati jedinici artikla „{name}“.`, 422). Links already stored on the same node are not re-validated.
      operationId: updateWorkOrderProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderProcessInput'
      responses:
        '200':
          description: Updated work-order process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderProcess'
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Structural change by a non-admin (`Samo administrator može menjati strukturu procesa.`). Also returned (`Modul „Procesi rada“ nije uključen za ovu organizaciju.`) when the module is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work order not found, or it has no process yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid graph, unknown article link or unit mismatch with the linked article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Processes]
      summary: Remove a work order's process (admin only)
      operationId: deleteWorkOrderProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required. Also returned (`Modul „Procesi rada“ nije uključen za ovu organizaciju.`) when the module is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Work order has no process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
