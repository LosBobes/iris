openapi: 3.1.0
info:
  title: Iris Operations API
  version: 0.3.0
  description: |
    Shared HTTP API for Iris work-order operations. Production runtime persists
    data in SQLite, while fixture-backed data remains available for development
    and automated tests.
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Auth
  - name: Customers
  - name: Work Orders
  - name: Dashboard
  - name: Processes
    description: Process templates (steps with inputs, products and byproducts) and each work order's own editable copy.
  - name: Stock
    description: >-
      Warehouse stock (magacin). Stock is an append-only movement ledger per catalog article (on-hand is the sum of
      its movements; services never carry stock). Goods receipts and counts post movements here; work-order
      processes post consumption/production automatically. A single warehouse per organization; negative stock is allowed.
  - name: Platform
    description: Backoffice (/backoffice in the web app). Superadmin accounts stored apart from organization users (own table, sessions and cookie); aggregate metrics only.
paths:
  /healthz:
    get:
      tags: [System]
      summary: Return backend readiness status
      operationId: healthz
      responses:
        '200':
          description: Backend is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user
      description: |
        Sets the HttpOnly `iris_session` cookie (SameSite=Lax). The token is
        random and stored server-side only as its SHA-256 hash. Its idle expiry
        slides forward on authenticated requests (rewritten at most once an
        hour) up to an absolute cap fixed at sign-in:

        - `remember` false (default): 12 h idle, 24 h at most, and a
          browser-session cookie (no `Expires`/`Max-Age`).
        - `remember` true: 7 days idle, 30 days at most, and a persistent
          cookie whose `Expires`/`Max-Age` always equals the server-side expiry
          (it is re-sent whenever the session slides).

        Failed attempts are rate limited in a 15-minute window, counted before
        the credentials are checked: 5 per organization + username from one
        client IP, 20 per client IP across usernames, and 50 per organization +
        username from all addresses together (so one address cannot lock an
        account out for everyone). A successful sign-in clears its counters;
        while any limit is reached every attempt, right password included,
        gets 429. A request whose `Origin` header is
        neither the API's own host nor allow-listed is refused with 403, like
        every other state-changing request.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CrossOriginRequest'
        '429':
          description: >-
            Too many failed attempts for this address or account. Body:
            `{"error":"Previše neuspešnih pokušaja. Pokušajte ponovo kasnije."}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/session:
    get:
      tags: [Auth]
      summary: Return the current cookie-backed session
      description: >-
        Like every authenticated request, this slides the session's idle expiry
        (at most once an hour, never past its absolute cap); a remembered
        session's cookie is re-sent with the new expiry.
      operationId: getCurrentSession
      responses:
        '200':
          description: Current session result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the current session
      operationId: logout
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
  /customers:
    get:
      tags: [Customers]
      summary: Return a paginated, optionally searched page of customers
      operationId: listCustomers
      parameters:
        - name: q
          in: query
          description: Case-insensitive search over name, PIB and MB.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Omit or <= 0 to return all matches.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: A page of customers plus the total match count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
  /customers/{id}:
    get:
      tags: [Customers]
      summary: Return a single customer by id
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /locations:
    get:
      tags: [Customers]
      summary: Return normalized customer locations
      operationId: listLocations
      parameters:
        - name: customerId
          in: query
          description: >-
            When set, only the locations belonging to this customer are
            returned. Omit to return every location for the tenant.
          schema:
            type: string
      responses:
        '200':
          description: Customer location records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
  /catalog-items:
    get:
      tags: [Catalog]
      summary: List admin-managed catalog articles and services
      operationId: listCatalogItems
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [service, article]
        - name: q
          in: query
          description: Case-insensitive search over name and code.
          schema:
            type: string
        - name: active
          in: query
          description: When 'true', only active items are returned.
          schema:
            type: string
            enum: ['true']
        - name: ids
          in: query
          description: >-
            Comma-separated catalog item ids for a batch lookup (at most 200
            distinct ids; blanks and duplicates are ignored). Only the caller's
            organization's items are returned; unknown ids are silently omitted.
            Combines with the other filters.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Omit or <= 0 to return all matches.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: A page of catalog items plus the total match count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemListResponse'
        '422':
          description: More than 200 distinct ids were requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Catalog]
      summary: Create a catalog item (admin only)
      operationId: createCatalogItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemInput'
      responses:
        '201':
          description: Created catalog item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid catalog item input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog-items/cleanup:
    get:
      tags: [Catalog]
      summary: Preview the catalog items a cleanup would delete (admin only)
      description: >-
        Lists the catalog items of the selected kinds that are missing the
        selected price. These are exactly the rows the matching POST removes
        (same query parameters), so an administrator can review them first.
      operationId: previewCatalogCleanup
      parameters:
        - $ref: '#/components/parameters/CatalogCleanupKind'
        - $ref: '#/components/parameters/CatalogCleanupMissing'
      responses:
        '200':
          description: Items that would be deleted
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  total:
                    type: integer
        '400':
          description: Missing or invalid kind/missing selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Catalog]
      summary: Delete catalog items missing the selected price (admin only)
      description: >-
        Removes every catalog item of the selected kinds that is missing the
        selected price — placeholder rows an administrator wants to sweep out —
        and returns how many were deleted. Both axes are explicit, so services
        and articles can be swept together or one at a time, and the sweep can
        target items with no purchase price, no sale price, or neither.
      operationId: cleanupCatalogItems
      parameters:
        - $ref: '#/components/parameters/CatalogCleanupKind'
        - $ref: '#/components/parameters/CatalogCleanupMissing'
      responses:
        '200':
          description: Number of items removed
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    description: Count of items that were deleted.
        '400':
          description: Missing or invalid kind/missing selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog-items/{id}:
    get:
      tags: [Catalog]
      summary: Return a single catalog item by id
      operationId: getCatalogItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The catalog item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '404':
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Catalog]
      summary: Update a catalog item
      description: >
        Admins update every field. Operators (non-admin) may change only the
        item's kind (vrsta); all other fields in the payload are ignored and the
        stored values are preserved. Operators cannot create items.
      operationId: updateCatalogItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemInput'
      responses:
        '200':
          description: Updated catalog item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '403':
          description: Operator attempted to create a catalog item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Catalog]
      summary: Delete a catalog item (admin only)
      operationId: deleteCatalogItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The article has stock movements and cannot be deleted; deactivate it instead (`Artikal ima promet u magacinu i ne može se obrisati.`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog-items/{id}/cost-history:
    get:
      tags: [Catalog]
      summary: Return a catalog item's effective-dated cost history (admin only)
      operationId: getCatalogItemCostHistory
      description: >-
        Lists the item's cost records newest period first. The store appends a
        record whenever an admin changes the item's price, so work orders can
        snapshot the cost in effect on their issue/completion date.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cost history records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItemCost'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /announcements:
    get:
      tags: [Settings]
      summary: Platform announcements active now for the session's organization
      description: >-
        Written by Backoffice superadmins (`/platform/announcements`). Only the
        ones whose window includes now and that target every organization or
        this one; maintenance first, then warning, then info. Shown as a banner
        at the top of the app; info ones can be dismissed per device.
      operationId: getAnnouncements
      responses:
        '200':
          description: Active announcements (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
        '401':
          description: No organization session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /settings:
    get:
      tags: [Settings]
      summary: Return shop-wide organization settings (firm name, PDF sections)
      operationId: getSettings
      responses:
        '200':
          description: The organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
    put:
      tags: [Settings]
      summary: Update organization settings (admin only)
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSettingsUpdate'
      responses:
        '200':
          description: Updated organization settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid settings input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /settings/login-logo:
    get:
      tags: [Settings]
      summary: Return the signed-in organization's sign-in logo image
      operationId: getLoginLogo
      responses:
        '200':
          description: The logo image bytes (PNG, JPEG or WebP)
          headers:
            ETag:
              schema:
                type: string
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '404':
          description: No logo is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Settings]
      summary: Replace the organization's sign-in logo (admin only)
      operationId: updateLoginLogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginLogoUpload'
      responses:
        '200':
          description: Logo stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLogoInfo'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Not a PNG, JPEG or WebP image, or larger than 512 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Settings]
      summary: Remove the organization's sign-in logo (admin only)
      operationId: deleteLoginLogo
      responses:
        '204':
          description: Logo removed (or none was set)
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      tags: [Users]
      summary: List user accounts (admin only)
      operationId: listUsers
      responses:
        '200':
          description: All accounts (id, username, role); never the password
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Users]
      summary: Create a user account (admin only)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Invalid input or duplicate username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{id}:
    put:
      tags: [Users]
      summary: Update a user's role and optionally reset their password (admin only)
      description: >-
        Setting a password ends every session of that user, impersonation
        sessions included. An admin changing their own password keeps the
        session making this request; their other sessions end.
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid input or last-admin guard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: Delete a user account (admin only)
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '422':
          description: Cannot delete yourself or the last administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Return server-side aggregated dashboard data for the session tenant
      description: >-
        Aggregates every work order of the caller's organization so the client
        does not have to download them all. `dateFrom`, `dateTo` and `issuedBy`
        filter the summary, monthly buckets, delivery distribution, top clients
        and finance. Signals, attention rows and queues always cover all orders.
        `finance` is cost-derived and returned only to administrators (`null`
        for operators).
      operationId: getDashboard
      parameters:
        - name: dateFrom
          in: query
          description: Inclusive lower bound on issueDate (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Inclusive upper bound on issueDate (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: issuedBy
          in: query
          description: Exact match on the issuing user.
          schema:
            type: string
        - name: companyKey
          in: query
          description: >-
            Scopes only `finance.itemProfit` to orders whose company group key
            (customerId, else the normalized client name) equals this value.
          schema:
            type: string
        - name: today
          in: query
          description: >-
            Client-local date (YYYY-MM-DD) used for attention signals and
            queues. Defaults to the server's local date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Aggregated dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'
        '400':
          description: A date parameter is not a valid YYYY-MM-DD date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /work-orders:
    get:
      tags: [Work Orders]
      summary: Return filtered and paginated work orders
      operationId: listWorkOrders
      description: >-
        Filtering, sorting and paging are server-side; `total` is the number of
        orders matching the filters (for the pager). For every match without
        paging use `GET /work-orders/export.csv`.
      parameters:
        - $ref: '#/components/parameters/WorkOrderSearch'
        - $ref: '#/components/parameters/WorkOrderStatusFilter'
        - $ref: '#/components/parameters/WorkOrderAssignedTo'
        - $ref: '#/components/parameters/WorkOrderCustomerId'
        - $ref: '#/components/parameters/WorkOrderBillingDocumentType'
        - $ref: '#/components/parameters/WorkOrderDeliveryMethod'
        - $ref: '#/components/parameters/WorkOrderQueue'
        - $ref: '#/components/parameters/WorkOrderToday'
        - $ref: '#/components/parameters/WorkOrderDateFrom'
        - $ref: '#/components/parameters/WorkOrderDateTo'
        - $ref: '#/components/parameters/WorkOrderNeedsCostReview'
        - $ref: '#/components/parameters/WorkOrderSort'
        - name: limit
          in: query
          description: >-
            Page size. Omitted, `0` or negative uses the default of 50; values
            above 200 are clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: view
          in: query
          description: >-
            Response projection. `summary` omits the per-order history
            collections (`statusHistory`, `internalNotes`, `customerNotes`,
            `events`, `attachments`, `materialUsage`, `timeEntries`), which
            only the detail page reads; the server reads a stored slim copy
            instead of decoding the full order. `invoiceDraft` is retained
            (duplicating an order from the list pre-fills from it). Omitted
            (`full`) returns every collection.
          schema:
            type: string
            enum: [full, summary]
            default: full
      responses:
        '200':
          description: >-
            Filtered work-order page. With `view=summary` the omitted
            collections are absent from each item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderListResponse'
    post:
      tags: [Work Orders]
      summary: Create a new work order
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderInput'
      responses:
        '201':
          description: Created work order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid work-order input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /work-orders/operators:
    get:
      tags: [Work Orders]
      summary: Return unique operator usernames sorted ascending
      operationId: listOperators
      responses:
        '200':
          description: Sorted operator usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /work-orders/export.csv:
    get:
      tags: [Work Orders]
      summary: Export every work order matching the list filters as CSV
      operationId: exportWorkOrdersCsv
      description: >-
        Same filters and sort as `GET /work-orders`, without paging. The file
        starts with a UTF-8 BOM, uses CRLF line endings and RFC 4180 quoting,
        column headers and labels (priority, document type, status) in the
        `lang` language, the due date as DD.MM.YYYY and the selling price as a
        plain number. A text cell that starts with `=`, `+`, `-`, `@`, a tab
        or a carriage return is prefixed with `'` so spreadsheets do not run it
        as a formula (the price column is never prefixed).
      parameters:
        - $ref: '#/components/parameters/WorkOrderSearch'
        - $ref: '#/components/parameters/WorkOrderStatusFilter'
        - $ref: '#/components/parameters/WorkOrderAssignedTo'
        - $ref: '#/components/parameters/WorkOrderCustomerId'
        - $ref: '#/components/parameters/WorkOrderBillingDocumentType'
        - $ref: '#/components/parameters/WorkOrderDeliveryMethod'
        - $ref: '#/components/parameters/WorkOrderQueue'
        - $ref: '#/components/parameters/WorkOrderToday'
        - $ref: '#/components/parameters/WorkOrderDateFrom'
        - $ref: '#/components/parameters/WorkOrderDateTo'
        - $ref: '#/components/parameters/WorkOrderNeedsCostReview'
        - $ref: '#/components/parameters/WorkOrderSort'
        - name: columns
          in: query
          description: >-
            Comma-separated list column keys to include, in canonical order
            (`orderNumber`, `clientName`, `jobDescription`, `assigned`,
            `priority`, `billing`, `schedule`, `price`, `status`).
            `orderNumber` is always included. Omitted exports every column.
          schema:
            type: string
            example: clientName,jobDescription,status
        - name: lang
          in: query
          description: >-
            Language of the column headers and labels: `sr` (Serbian, default)
            or `en` (English). The web client sends its current UI language.
          schema:
            type: string
            enum: [sr, en]
            default: sr
      responses:
        '200':
          description: CSV file (`Content-Disposition` attachment).
          headers:
            X-Total-Count:
              description: Number of exported orders.
              schema:
                type: integer
          content:
            text/csv:
              schema:
                type: string
