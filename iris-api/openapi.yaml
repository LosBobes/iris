          description: The organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrganization'
        '404':
          description: Unknown organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/organizations/{slug}/logo:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Auth]
      summary: Return an organization's sign-in logo image
      description: |
        Unauthenticated. Served with `Cache-Control: no-cache` and an ETag equal
        to the quoted `logoVersion`, plus `X-Content-Type-Options: nosniff`.
      operationId: getPublicOrganizationLogo
      security: []
      responses:
        '200':
          description: The logo image bytes
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '304':
          description: Not modified (If-None-Match matched)
        '404':
          description: Unknown organization or no logo set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/organizations/{slug}/announcements:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Auth]
      summary: Platform announcements active now for an organization, for its sign-in page
      description: |
        Unauthenticated. Same list as `GET /announcements` for that
        organization: message, severity and time window only.
      operationId: getPublicAnnouncements
      security: []
      responses:
        '200':
          description: Active announcements (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
        '404':
          description: Unknown organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/auth/login:
    post:
      tags: [Platform]
      summary: Sign in to the Backoffice (superadmin accounts only)
      description: |
        Superadmins live in `platform_admins`, separate from every organization's
        users: organization credentials never work here and Backoffice
        credentials never work on `/auth/login`. A database with no superadmin
        gets `admin` / `admin123321`, which must change its password first;
        `irisctl create-platform-admin` adds more. Sets the `iris_platform_session` cookie
        (HttpOnly, SameSite=Strict, 2 h). Failed attempts are rate limited per
        IP, per username and globally, and recorded in the activity log as
        `admin.login_failed` (with the username as typed; never the password).
        Disabled accounts cannot sign in (same generic error). For an account
        with two-factor sign-in, a correct password returns `success: false`,
        `twoFactorRequired: true` and a `challenge` (valid 5 min) instead of a
        session: finish with `POST /platform/auth/login/verify`.
      operationId: platformLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformLoginRequest'
      responses:
        '200':
          description: Login result (success false on bad credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/auth/login/verify:
    post:
      tags: [Platform]
      summary: Second sign-in step for an account with two-factor sign-in
      description: |
        Takes the `challenge` from the password step and either a 6-digit TOTP
        code from the authenticator app (each code is accepted once) or an
        unused recovery code (then spent; recorded as `admin.recovery_login`).
        On success sets the `iris_platform_session` cookie like a password-only
        sign-in. A wrong code returns `success: false`, `twoFactorRequired: true`
        and the same challenge to retry, and is recorded as `admin.login_failed`
        (stage `2fa`); an unknown or expired challenge returns `success: false`
        without `twoFactorRequired` (sign in again). Wrong codes are rate limited
        per account and per IP (429).
      operationId: platformLoginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformLoginVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/auth/2fa/setup:
    post:
      tags: [Platform]
      summary: Start two-factor (TOTP) enrollment for the signed-in superadmin
      description: |
        Generates a new secret, kept as pending until confirmed (calling it again
        replaces it). Returns the secret, the `otpauth://` URI and the URI as a
        QR code PNG data URL. 422 when two-factor sign-in is already on (only
        `irisctl reset-platform-2fa` resets it). Two-factor sign-in is
        mandatory for superadmins: until it is on (and after a reset), every
        other operator route answers 403, except the session, sign-out and
        password routes.
      operationId: setupPlatformTwoFactor
      security:
        - PlatformSession: []
      responses:
        '200':
          description: Pending enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTwoFactorSetup'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Two-factor sign-in is already on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/auth/2fa/confirm:
    post:
      tags: [Platform]
      summary: Confirm two-factor enrollment with a code from the app
      description: |
        Turns two-factor sign-in on and returns 10 one-time recovery codes, shown
        only this once (stored hashed). Recorded as `admin.2fa_enable`. Wrong
        codes return 422 and are rate limited (429).
      operationId: confirmPlatformTwoFactor
      security:
        - PlatformSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Two-factor sign-in is on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTwoFactorEnabled'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Wrong code, no enrollment started, or already on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/admins:
    get:
      tags: [Platform]
      summary: List superadmin accounts (operator only)
      operationId: getPlatformAdmins
      security:
        - PlatformSession: []
      responses:
        '200':
          description: Every superadmin, by username
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformAdminSummary'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Platform]
      summary: Add a superadmin with a temporary password (operator only)
      description: |
        The new account must change its password at first sign-in
        (`mustChangePassword`). Passwords need at least 12 characters. Recorded
        as `admin.create`.
      operationId: createPlatformAdmin
      security:
        - PlatformSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCreateAdminInput'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAdminSummary'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing or taken username, or password too short/long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/admins/{id}/disable:
    post:
      tags: [Platform]
      summary: Disable a superadmin (operator only)
      description: |
        Ends the account's Backoffice sessions and every organization session it
        opened by impersonation; it can no longer sign in. You cannot disable
        your own account or the last enabled one (422). Recorded as
        `admin.disable`; repeating it changes nothing.
      operationId: disablePlatformAdmin
      security:
        - PlatformSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAdminSummary'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such superadmin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Your own account, or the last enabled one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/admins/{id}/enable:
    post:
      tags: [Platform]
      summary: Re-enable a disabled superadmin (operator only)
      description: Recorded as `admin.enable`; repeating it changes nothing.
      operationId: enablePlatformAdmin
      security:
        - PlatformSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAdminSummary'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such superadmin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/auth/session:
    get:
      tags: [Platform]
      summary: Return the current operator session, if any
      operationId: getPlatformSession
      security: []
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
  /platform/auth/logout:
    post:
      tags: [Platform]
      summary: End the operator session
      operationId: platformLogout
      security: []
      responses:
        '200':
          description: Signed out
  /platform/auth/password:
    post:
      tags: [Platform]
      summary: Change the signed-in operator's password
      description: |
        The only action open to an account with `mustChangePassword` (such as the
        default `admin` seeded on a database with no operators). New passwords
        need at least 12 characters and must differ from the current one; every
        other session of the account is signed out. Wrong current passwords are
        rate limited like logins.
      operationId: changePlatformPassword
      security:
        - PlatformSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Wrong current password, or new password too weak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/metrics:
    get:
      tags: [Platform]
      summary: Aggregate usage metrics across organizations (operator only)
      description: Counts, dates and sizes only; never customer, user or work-order records.
      operationId: getPlatformMetrics
      security:
        - PlatformSession: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30, 90, 365]
            default: 30
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetrics'
        '400':
          description: Unsupported range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No operator session (an organization session is never accepted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/users:
    get:
      tags: [Platform]
      summary: List an organization's accounts, to pick one to impersonate (operator only)
      description: Id, username and role only.
      operationId: getPlatformTenantUsers
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The organization and its accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantUsers'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No organization with that slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/impersonate:
    post:
      tags: [Platform]
      summary: Open an organization session as one of its users (operator only)
      description: >
        Sets an ordinary `iris_session` cookie for the chosen user (replacing any
        organization session in this browser), valid for one hour and never
        extended (it does not slide like a signed-in session). The session
        reports `impersonatedBy` on `/auth/session`, is written to the
        `impersonation_events` audit log with the required `reason` (every
        change request made with it is traced, see `/platform/audit`), is not
        counted as a login, and ends on `/auth/logout`, when the superadmin
        signs out of the Backoffice, or when the superadmin is disabled.
      operationId: platformImpersonate
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformImpersonationRequest'
      responses:
        '200':
          description: Session opened
          headers:
            Set-Cookie:
              schema:
                type: string
              description: iris_session (HttpOnly)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformImpersonationResponse'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization, or the user is not in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No user chosen, or the reason is missing or over 200 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/impersonations/{id}/actions:
    get:
      tags: [Platform]
      summary: Change requests made during one impersonation, oldest first (operator only)
      description: >
        Every POST/PUT/PATCH/DELETE made with the impersonated session: method,
        route pattern, path, response status and time. Request bodies are never
        recorded; reads are not traced. Still available after the
        organization is deleted.
      operationId: getPlatformImpersonationActions
      security:
        - PlatformSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformImpersonationAction'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such impersonation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants:
    get:
      tags: [Platform]
      summary: List organizations with status and account counts (operator only)
      description: >-
        Each organization carries `health` (activity counts and dates only; never customer, user or
        work-order records — one grouped query per source, not per organization) and the superadmins'
        internal `notes` (`PUT /platform/tenants/{slug}/notes`).
      operationId: getPlatformTenants
      security:
        - PlatformSession: []
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformTenant'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Platform]
      summary: Create an organization and its first admin (operator only)
      description: Recorded in the activity log as `tenant.create`.
      operationId: createPlatformTenant
      security:
        - PlatformSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCreateTenantInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenant'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid name, slug, username or password, or the slug is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}:
    patch:
      tags: [Platform]
      summary: Rename an organization and/or change its sign-in slug (operator only)
      description: >
        Recorded as `tenant.update` with the old and new values. A new slug
        changes the `/login/<slug>` address; devices that remembered the old
        one have to choose the organization again.
      operationId: updatePlatformTenant
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdateTenantInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenant'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid name or slug, or the slug is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Platform]
      summary: Permanently delete a suspended organization and all its data (operator only)
      description: >
        Two-phase: the organization must be suspended first, and the body must
        repeat its slug exactly. Deletes every row the organization owns in one
        transaction (users, sessions, customers, work orders, catalog, stock,
        processes, settings, login history, superadmin notes). Recorded as
        `tenant.delete` with the name, slug and row counts; the activity log
        keeps all earlier events of the organization, and its impersonation
        history (each session's reason, status and request trail) is kept,
        detached from the deleted organization. Cannot be undone — export
        first.
      operationId: deletePlatformTenant
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformDeleteTenantInput'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantDeletion'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The organization is not suspended, or confirmSlug does not match its slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/export:
    get:
      tags: [Platform]
      summary: Download a full export of one organization's data (operator only)
      description: >
        A single JSON document (attachment, `iris-<slug>-<YYYYMMDD-HHMMSS>.json`)
        with every row the organization owns, without password hashes or
        sessions. Platform-side rows about the organization (superadmin notes,
        announcement targeting) are not part of it. A sensitive read, so it is
        recorded as `tenant.export`.
      operationId: exportPlatformTenant
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The export file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenantExport'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/suspend:
    post:
      tags: [Platform]
      summary: Suspend an organization (operator only)
      description: >
        Ends every ordinary session of its users and refuses new sign-ins
        (after a correct password, with a "suspended" message). Data is kept and
        Backoffice impersonation still works. Recorded as `tenant.suspend`; a
        repeat is a no-op.
      operationId: suspendPlatformTenant
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenant'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/modules:
    put:
      tags: [Platform]
      summary: Switch an organization's optional modules (operator only)
      description: >-
        Sets both modules ("Procesi rada" and "Magacin") of the organization. `processes: true` requires
        `stock: true` (422 `Modul „Procesi rada“ zahteva uključen modul „Magacin“.`, nothing written). Recorded as
        `tenant.modules` in the activity log, in the same transaction, with detail
        `{"processes":"on|off","stock":"on|off","changed":"processes,stock"}` (new values; `changed` lists the
        names that differ). Setting the current state is a no-op: 200 and no audit row.
      operationId: setPlatformTenantModules
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationModules'
      responses:
        '200':
          description: The organization with its modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenant'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`processes` without `stock`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/notes:
    put:
      tags: [Platform]
      summary: Replace an organization's internal notes (operator only)
      description: >-
        Contact person, contact e-mail/phone, plan (free text) and multiline notes, visible only in the
        Backoffice (stored in `tenant_notes`, never in the organization's settings). Values are trimmed;
        the four short fields take at most 200 characters, `notes` at most 10000, and a non-empty
        `contactEmail` must look like an address (422 otherwise). Recorded as `tenant.notes` in the
        activity log, in the same transaction, with detail `{"fields":"contactName,plan,..."}` — the
        names of the changed fields, never their contents. Saving identical notes is a no-op: 200 and
        no audit row.
      operationId: setPlatformTenantNotes
      security:
        - PlatformSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformTenantNotesInput'
      responses:
        '200':
          description: The organization with its notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTenant'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A field is too long or the contact e-mail is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/reactivate:
    post:
      tags: [Platform]
      summary: Reactivate a suspended organization (operator only)
      description: Recorded as `tenant.reactivate`; a repeat is a no-op.
      operationId: reactivatePlatformTenant
      security:
        - PlatformSession: []
      parameters:
        - name: slug
