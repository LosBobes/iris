            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/tenants/{slug}/users/{id}/password:
    post:
      tags: [Platform]
      summary: Set a new password for an organization user (operator only)
      description: >
        Signs that user out everywhere (impersonation sessions aside). Recorded
        as `user.password_reset`; the password itself is never logged.
      operationId: resetPlatformUserPassword
      security:
        - PlatformSession: []
