              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/backups:
    get:
      tags: [Platform]
      summary: Backup status and the newest backup copies (operator only)
      description: >
        SQLite only: copies are written to `IRIS_BACKUP_DIR` (default a `backups`
        folder next to the database) under generated names
        `iris-YYYYMMDD-HHMMSS[-N].db`, newest first, at most 50 (`total` counts
        all). Copies are listed, never served. On PostgreSQL `supported` is
        false: backups are taken outside the API (pg_dump, deploy/POSTGRES.md).
      operationId: getPlatformBackups
      security:
        - PlatformSession: []
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformBackups'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Platform]
      summary: Take a backup copy now (operator only)
      description: >
        Writes a consistent copy of the SQLite database (VACUUM INTO), then
        prunes the directory to the newest `IRIS_BACKUP_KEEP` copies. Takes no
        input. Recorded as `backup.create` with detail `{name, sizeBytes}`.
      operationId: createPlatformBackup
      security:
        - PlatformSession: []
      responses:
        '201':
          description: The new copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformBackup'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Backups are not taken by the API on this database (PostgreSQL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /platform/audit:
    get:
      tags: [Platform]
      summary: Backoffice activity log, newest first (operator only)
      description: >
        Every superadmin operation: organizations created, edited, suspended and
        reactivated, passwords reset, and impersonations (with their session
        state and change count; the changes themselves are at
        `/platform/impersonations/{id}/actions`).
      operationId: getPlatformAudit
      security:
        - PlatformSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of the log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAuditLog'
        '401':
          description: No operator session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account must change its password or turn on two-factor sign-in first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
