          $ref: '#/components/schemas/OrganizationModules'
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        createdAt:
          type: string
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        users:
          type: integer
        admins:
          type: integer
        health:
          $ref: '#/components/schemas/PlatformTenantHealth'
        notes:
          $ref: '#/components/schemas/PlatformTenantNotes'
    PlatformTenantHealth:
      type: object
      description: Activity at a glance. Counts and dates only; never customer, user or work-order records.
      required: [lastLoginAt, activeUsers7d, activeUsers30d, workOrdersCreated30d, openWorkOrders, dormant]
      properties:
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Newest recorded sign-in (impersonation is not a sign-in).
        activeUsers7d:
          type: integer
          description: Distinct users who signed in within 7 days or hold a live, non-impersonated session.
        activeUsers30d:
          type: integer
          description: Same, within 30 days.
        workOrdersCreated30d:
          type: integer
        openWorkOrders:
          type: integer
          description: Work orders not completed, cancelled or invoiced.
        dormant:
          type: boolean
          description: >-
            No active user in 30 days (`activeUsers30d` is 0) and the organization is older than 30 days.
    PlatformTenantNotes:
      type: object
      description: Superadmin-only internal notes; empty strings until first saved.
      required: [contactName, contactEmail, contactPhone, plan, notes, updatedAt, updatedBy]
      properties:
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        plan:
          type: string
        notes:
          type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true
          description: Username of the superadmin who saved them last.
    PlatformTenantNotesInput:
      type: object
      properties:
        contactName:
          type: string
          maxLength: 200
        contactEmail:
          type: string
          maxLength: 200
        contactPhone:
          type: string
          maxLength: 200
        plan:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 10000
    PlatformCreateTenantInput:
      type: object
      required: [name, slug, adminUsername, adminPassword]
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 64
        adminUsername:
          type: string
        adminPassword:
          type: string
          minLength: 6
    PlatformUpdateTenantInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 2
          maxLength: 64
    PlatformTenantExport:
      type: object
      description: >
        Every row the organization owns, table by table (column -> value).
        users carry no password_hash; sessions, tenant_notes (superadmin-internal)
        and platform_announcement_tenants (platform-side targeting) are not
        exported, although deleting the organization removes them too. JSON
        columns (work_orders.payload, process_templates.graph,
        work_order_processes.graph) are embedded as JSON.
      required: [format, formatVersion, exportedAt, schemaVersion, tenant, totalRows, counts, tables]
      properties:
        format:
          type: string
          enum: [iris-tenant-export]
        formatVersion:
          type: integer
          description: Bumped when the layout changes incompatibly (currently 1).
        exportedAt:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          description: Highest applied database migration.
        tenant:
          type: object
          required: [id, slug, name, createdAt, suspendedAt]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            createdAt:
              type: string
            suspendedAt:
              type: string
              nullable: true
        totalRows:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
        tables:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
    PlatformDeleteTenantInput:
      type: object
      required: [confirmSlug]
      properties:
        confirmSlug:
          type: string
          description: The organization's slug, typed again exactly.
    PlatformTenantDeletion:
      type: object
      required: [slug, name, deletedAt, totalRows, rows]
      properties:
        slug:
          type: string
        name:
          type: string
        deletedAt:
          type: string
          format: date-time
        totalRows:
          type: integer
        rows:
          type: object
          description: Deleted rows per table.
          additionalProperties:
            type: integer
    PlatformPasswordReset:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 6
    PlatformAuditEvent:
      type: object
      required: [id, at, adminUsername, action, tenantSlug, tenantName, ip]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        adminUsername:
          type: string
        action:
          type: string
          enum: [tenant.create, tenant.update, tenant.suspend, tenant.reactivate, tenant.modules, tenant.notes, tenant.export, tenant.delete, user.password_reset, impersonate, process_template.create, process_template.update, process_template.delete, admin.create, admin.disable, admin.enable, admin.2fa_enable, admin.2fa_reset, admin.login_failed, admin.recovery_login, backup.create, announcement.create, announcement.update, announcement.end, announcement.delete]
          description: >
            `admin.*` events concern superadmin accounts and have no organization
            (empty tenantSlug/tenantName); targetUsername is the account acted
            on. On `admin.login_failed` adminUsername is the username as typed
            and detail.stage is `password` or `2fa`. `admin.2fa_reset` done from
            the server has adminUsername `irisctl`.
        tenantSlug:
          type: string
          description: As it was at the time.
        tenantName:
          type: string
          description: As it was at the time.
        targetUsername:
          type: string
        detail:
          type: object
          additionalProperties:
            type: string
          description: >
            For tenant.update, fromName/toName and fromSlug/toSlug of what changed.
            For tenant.export, totalRows; for tenant.delete, totalRows, users,
            customers and workOrders (deleted row counts).
        ip:
          type: string
        impersonation:
          type: object
          required: [id, expiresAt, endedAt, actionCount, reason]
          properties:
            reason:
              type: string
              description: Given when it was started (empty for impersonations from before it was required).
            id:
              type: integer
              format: int64
            expiresAt:
              type: string
              format: date-time
            endedAt:
              type: string
              format: date-time
              nullable: true
            actionCount:
              type: integer
    PlatformAuditLog:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAuditEvent'
        total:
          type: integer
    PlatformImpersonationAction:
      type: object
      required: [at, method, route, path, status]
      properties:
        at:
          type: string
          format: date-time
        method:
          type: string
          enum: [POST, PUT, PATCH, DELETE]
        route:
          type: string
          example: /work-orders/{id}
        path:
          type: string
          example: /work-orders/wo-123
        status:
          type: integer
    PlatformMetrics:
      type: object
      required: [generatedAt, rangeDays, rangeStart, totals, system, tenants, daily]
      properties:
        generatedAt:
          type: string
          format: date-time
        rangeDays:
          type: integer
          enum: [7, 30, 90, 365]
        rangeStart:
          type: string
          format: date
        totals:
          type: object
          properties:
            tenants:
              type: integer
            users:
              type: integer
            customers:
              type: integer
            catalogItems:
              type: integer
            workOrders:
              type: integer
            workOrdersInRange:
              type: integer
            openWorkOrders:
              type: integer
            loginsInRange:
              type: integer
            activeUsersInRange:
              type: integer
            activeSessions:
              type: integer
            databaseBytes:
              type: integer
        system:
          type: object
          properties:
            release:
              type: string
            goVersion:
              type: string
            startedAt:
              type: string
              format: date-time
            uptimeSeconds:
              type: integer
            goroutines:
              type: integer
            heapBytes:
              type: integer
            engine:
              type: string
              enum: [sqlite, postgres]
            schemaVersion:
              type: integer
              description: Highest applied schema migration.
            backup:
              $ref: '#/components/schemas/PlatformBackupStatus'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantMetrics'
        daily:
          type: array
          description: One point per day of the range, zero-filled for every organization.
          items:
            type: object
            required: [date, workOrders, logins]
            properties:
              date:
                type: string
                format: date
              workOrders:
                type: object
                description: Work orders created that day, keyed by organization slug.
                additionalProperties:
                  type: integer
              logins:
                type: object
                description: Sign-ins that day, keyed by organization slug.
                additionalProperties:
                  type: integer
    PlatformBackupStatus:
      type: object
      required: [supported, lastBackupAt, stale, staleAfterHours, intervalSeconds]
      properties:
        supported:
          type: boolean
          description: False on PostgreSQL, where backups are managed outside the API.
        lastBackupAt:
          type: [string, 'null']
          format: date-time
        stale:
          type: boolean
          description: Supported and the newest copy is missing or older than staleAfterHours.
        staleAfterHours:
          type: integer
          description: IRIS_BACKUP_STALE_HOURS (default 24).
        intervalSeconds:
          type: integer
          description: Automatic backup interval (IRIS_BACKUP_INTERVAL); 0 when off.
    PlatformBackup:
      type: object
      required: [name, sizeBytes, createdAt]
      properties:
        name:
          type: string
          example: iris-20261018-080000.db
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    PlatformBackups:
      allOf:
        - $ref: '#/components/schemas/PlatformBackupStatus'
        - type: object
          required: [engine, directory, keep, total, items]
          properties:
            engine:
              type: string
              enum: [sqlite, postgres]
            directory:
              type: string
              description: Server path of the backup directory; empty when unsupported.
            keep:
              type: integer
              description: Copies retained (IRIS_BACKUP_KEEP); 0 keeps all.
            total:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/PlatformBackup'
    PlatformTenantMetrics:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        createdAt:
          type: string
        users:
          type: integer
        admins:
          type: integer
        customers:
          type: integer
        catalogItems:
          type: integer
        workOrders:
          type: integer
        workOrdersInRange:
          type: integer
        openWorkOrders:
          type: integer
        loginsInRange:
          type: integer
        activeUsersInRange:
          type: integer
        activeSessions:
          type: integer
        statusCounts:
          type: object
          additionalProperties:
            type: integer
        lastWorkOrderAt:
          type: [string, 'null']
        lastLoginAt:
          type: [string, 'null']
        hasLoginLogo:
          type: boolean
    PublicOrganization:
      type: object
      required: [slug, name, logoVersion]
      properties:
        slug:
          type: string
        name:
          type: string
        logoVersion:
          type: [string, 'null']
          description: Content hash of the sign-in logo; null when none is set.
    Announcement:
      type: object
      description: A platform announcement as an organization's users see it.
      required: [id, message, severity, startsAt, endsAt]
      properties:
        id:
          type: string
        message:
          type: string
          maxLength: 500
          description: Plain text.
        severity:
          type: string
          enum: [info, warning, maintenance]
          description: Info banners can be dismissed by the user; warning and maintenance ones cannot.
        startsAt:
          type: string
          format: date-time
          description: UTC, `YYYY-MM-DDTHH:MM:SSZ`.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: UTC; null means until ended.
    PlatformAnnouncement:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          required: [status, allTenants, tenants, createdAt, createdBy, updatedAt]
          properties:
            status:
              type: string
              enum: [active, scheduled, ended]
              description: At the time of the request.
            allTenants:
              type: boolean
            tenants:
              type: array
              description: Targeted organizations (current slug and name); empty when allTenants.
              items:
                type: object
                required: [slug, name]
                properties:
                  slug:
                    type: string
                  name:
                    type: string
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
              description: Superadmin username.
            updatedAt:
              type: string
              format: date-time
    PlatformAnnouncementInput:
      type: object
      required: [message, severity]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
        severity:
          type: string
          enum: [info, warning, maintenance]
        startsAt:
          type: [string, 'null']
          format: date-time
          description: RFC 3339; defaults to now.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: RFC 3339, after startsAt (and, on create, in the future); null keeps it up until ended.
        allTenants:
          type: boolean
          default: false
        tenantSlugs:
          type: array
          items:
            type: string
          description: Required (non-empty) unless allTenants; ignored when it is set.
    LoginLogoUpload:
      type: object
      required: [contentType, data]
      properties:
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        data:
          type: string
          description: Base64 image bytes (a full data URL is also accepted). Max 512 KB decoded; the server sniffs the actual type.
    LoginLogoInfo:
      type: object
      required: [logoVersion]
      properties:
        logoVersion:
          type: string
    PublicWorkOrderStatus:
      type: object
      required:
        [orderNumber, clientName, jobDescription, status, dueDate, customerNoteCount, internalNoteCount, signedBy, signedAt]
      properties:
        orderNumber:
          type: string
        clientName:
          type: string
        jobDescription:
          type: string
        status:
          type: string
          enum: [new, assigned, inProgress, completed, cancelled, invoiced]
        dueDate:
          type: [string, 'null']
          format: date
        customerNoteCount:
          type: integer
        internalNoteCount:
          type: integer
        signedBy:
          type: [string, 'null']
        signedAt:
          type: [string, 'null']
          format: date-time
    ReservedOrderNumber:
      type: object
      required: [orderNumber, expiresAt]
      properties:
        orderNumber:
          type: string
          example: RN-2026-00042
        expiresAt:
          type: string
          format: date-time
          description: When the reservation lapses and its number may be reclaimed.
    EditLock:
      type: object
      required: [workOrderId, lockedBy, lockedAt]
      properties:
        workOrderId:
          type: string
        lockedBy:
          type: string
          description: Username of the operator holding the lock.
        lockedAt:
          type: string
          format: date-time
          description: When the current holder first acquired the lock.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the lock auto-expires without a heartbeat. Present on the 200
            response for the holder; omitted on the 409 holder-identity response.
    DeleteWorkOrderResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Radni nalog nije pronađen.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            Serbian message safe to show the operator. Internal detail (SQL,
            file paths, decode errors) is logged and reported to Sentry
            instead of being returned here.
        requestId:
          type: string
          description: >-
            Short reference for this failed request, also sent as the
            X-Request-Id header and attached to the server log line and the
            Sentry event. Clients show it with the error message so a
            photographed screen can be traced to the exact request.
