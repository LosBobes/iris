    PlatformLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    PlatformLoginResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        admin:
          type: object
          properties:
            username:
              type: string
            role:
              type: string
              enum: [superadmin]
              description: The only Backoffice role.
            mustChangePassword:
              type: boolean
              description: True until the account replaces its initial password.
            twoFactorEnabled:
              type: boolean
              description: >
                True once the account has enrolled an authenticator app.
                Mandatory: while false, the console allows only enrollment.
        error:
          type: string
        twoFactorRequired:
          type: boolean
          description: The password was right; send a code with `challenge` to `/platform/auth/login/verify`.
        challenge:
          type: string
          description: Opaque, single-use, valid 5 minutes.
    PlatformLoginVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge:
          type: string
        code:
          type: string
          description: A 6-digit TOTP code, or a recovery code (case, spaces and dashes ignored).
    PlatformTwoFactorSetup:
      type: object
      required: [secret, otpauthUri, qrCode]
      properties:
        secret:
          type: string
          description: Base32 secret, for typing into the app by hand.
        otpauthUri:
          type: string
          example: otpauth://totp/Iris%20Backoffice:ops?algorithm=SHA1&digits=6&issuer=Iris%20Backoffice&period=30&secret=...
        qrCode:
          type: string
          description: The URI as a QR code, a `data:image/png;base64,` URL.
    PlatformTwoFactorEnabled:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
            example: abcde-fgh23
    PlatformAdminSummary:
      type: object
      required: [id, username, createdAt, lastLoginAt, twoFactorEnabled, mustChangePassword, disabledAt]
      properties:
        id:
          type: string
        username:
          type: string
        createdAt:
          type: string
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        twoFactorEnabled:
          type: boolean
        mustChangePassword:
          type: boolean
          description: Still on a temporary password.
        disabledAt:
          type: string
          format: date-time
          nullable: true
    PlatformCreateAdminInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 12
          description: Temporary; the new superadmin must change it at first sign-in.
    PlatformTenantUsers:
      type: object
      required: [tenant, users]
      properties:
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PlatformImpersonationRequest:
      type: object
      required: [userId, reason]
      properties:
        userId:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 200
