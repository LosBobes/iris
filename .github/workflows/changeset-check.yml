name: Changeset

# Every PR must add a .changeset/*.md file naming its semver level (patch,
# minor, major) and describing the change; build.yml applies them on merge.
# See .changeset/README.md. Label a PR `skip-changeset` to opt out.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a valid changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        run: |
          if [ "${SKIP}" = "true" ]; then
            echo "skip-changeset label set; not requiring a changeset."
            exit 0
          fi
          added="$(git diff --name-only --diff-filter=AM "${BASE_SHA}...HEAD" -- '.changeset/*.md' | grep -v '^.changeset/README.md$' || true)"
          if [ -z "${added}" ]; then
            echo "::error::This PR has no changeset. Add one with:"
            echo "::error::  node scripts/changeset.mjs add <patch|minor|major> \"What changed, in plain text\""
            exit 1
          fi
          node scripts/changeset.mjs check ${added}
