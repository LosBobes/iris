# Deployment compose for the Iris stack on the client's Windows Server.
#
# This runs Linux containers (Docker with the WSL2 backend). The server tracks
# the :latest tags and updates on a schedule via deploy/update.ps1, which runs
# `docker compose pull` then `docker compose up -d` from this directory.
#
# The `build:` blocks let `docker compose build` work from a clean checkout
# (CI and local dev); on the deployed server only `image:` is used, since the
# server pulls prebuilt images from GHCR instead of building.
#
# Build context is the repository root (..), one level up from this file.

services:
  db:
    # PostgreSQL, opt-in: starts only with the "postgres" profile, switched on
    # by COMPOSE_PROFILES=postgres in the deploy directory's .env (README,
    # "PostgreSQL"). Without it the backend keeps using SQLite as before.
    profiles: ["postgres"]
    # Same pin as docker-compose.prod.yml, so a pg_dump from the Hetzner box
    # restores here unchanged. Debian-based (not -alpine) for the ICU "nocase"
    # collation. Do NOT move to Postgres 18: its image keeps data under a
    # different path than the volume mounted below. See deploy/POSTGRES.md.
    image: "postgres:16.15"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "iris"
      POSTGRES_USER: "iris"
      # Not `:?`: compose interpolates the whole file before filtering by
      # profile, so a required variable would break SQLite installs too.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    # Internal only: never published to the host or the LAN.
    expose:
      - "5432"
    volumes:
      # A named volume (inside Docker Desktop's WSL2 disk), not a bind mount
      # to a Windows folder: Postgres needs Linux file permissions and fsync.
      - iris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/losbobes/iris-backend:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      IRIS_ENV: "${IRIS_ENV:-production}"
      # Empty means SQLite at DATABASE_PATH. With the postgres profile on, set
      # it in .env to postgres://iris:<POSTGRES_PASSWORD>@db:5432/iris?sslmode=disable
      # (no depends_on for db, because of the profile: if Postgres is not up
      # yet the API exits and `restart: unless-stopped` retries it).
      DATABASE_URL: "${DATABASE_URL:-}"
      DATABASE_PATH: "/data/iris.db"
      # The LAN is reached over plain http://<server>/, and browsers drop
      # Secure cookies on http (except localhost), so sign-in would silently
      # fail. Set IRIS_SECURE_COOKIES=false in .env for a plain-http LAN
      # install; leave it empty when the stack is served over HTTPS.
      IRIS_SECURE_COOKIES: "${IRIS_SECURE_COOKIES:-}"
      # Same-origin: the browser hits nginx, which proxies /api/ to this
      # service, so no cross-origin allow-list is required.
      IRIS_ALLOWED_ORIGINS: "${IRIS_ALLOWED_ORIGINS:-}"
      # Error reporting (Sentry). The DSN is baked into the published backend
      # image at build time from the SENTRY_DSN GitHub Actions secret, so it
      # works with no server config and is intentionally NOT set here: an
      # explicit value (even empty) would override the baked-in one. To point
      # at a different project or disable Sentry, uncomment and set it below
      # (an empty value disables Sentry, since it initializes only on a
      # non-empty DSN):
      # SENTRY_DSN: "${SENTRY_DSN:-}"
      # Optional release identifier shown in Sentry (e.g. the git sha or tag).
      IRIS_RELEASE: "${IRIS_RELEASE:-}"
      # SQLite backups (ignored with DATABASE_URL; on Postgres use backup.ps1)
      # (Backoffice "Sistem" tab). Copies go to /data/backups on
      # the data volume; empty values take the defaults (keep 14, warn after
      # 24 h). IRIS_BACKUP_INTERVAL (e.g. 24h) turns on automatic copies.
      IRIS_BACKUP_DIR: "${IRIS_BACKUP_DIR:-}"
      IRIS_BACKUP_KEEP: "${IRIS_BACKUP_KEEP:-}"
      IRIS_BACKUP_INTERVAL: "${IRIS_BACKUP_INTERVAL:-}"
      IRIS_BACKUP_STALE_HOURS: "${IRIS_BACKUP_STALE_HOURS:-}"
    # Internal only: the backend is never published to the LAN directly.
    # nginx (frontend) reaches it over the compose network on this port.
    expose:
      - "8080"
    volumes:
      # SQLite database persists here. This named volume survives every
      # container recreate during an update; only `docker compose down -v`
      # would delete it.
      - iris_sqlite_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/losbobes/iris-frontend:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # The only inbound port published to the LAN. Outbound HTTPS to ghcr.io
    # (for image pulls) is independent and needs no inbound publishing.
    ports:
      - "80:80"
    environment:
      # Browsers connect straight to this nginx, so no X-Forwarded-For is
      # trusted (empty): a LAN client must not be able to pick the address the
      # sign-in limits count. Set only if a reverse proxy is put in front, to
      # that proxy's address as nginx sees it. See deploy/README.md.
      IRIS_TRUSTED_PROXY: "${IRIS_TRUSTED_PROXY:-}"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  iris_sqlite_data:
  iris_postgres_data:
