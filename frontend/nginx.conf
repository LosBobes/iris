# Compress everything text-shaped on the way out. The Hetzner deploy also has
# Caddy in front (which compresses too, and passes an already-compressed
# response straight through), but the LAN deploy in deploy/docker-compose.yml
# publishes this nginx directly on port 80 with nothing in front of it — there
# this is the only compression the browser gets. The built bundle is ~1.5 MB
# uncompressed against ~0.44 MB gzipped.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Strips the /api prefix for the reverse proxy below, off the raw $request_uri
# so percent-encoding is preserved byte for byte:
#   /api/work-orders?view=summary  ->  /work-orders?view=summary
# Lives at http level because proxy_pass cannot do the stripping itself once
# its URI contains a variable. conf.d/*.conf is included inside http {}.
map $request_uri $iris_backend_uri {
    ~^/api(/.*)$  $1;
    default       /;
}

server {
    listen 80;

    root /usr/share/nginx/html;

    # Vite emits every asset with a content hash in its filename, so a changed
    # file always ships under a new name and these can be cached permanently.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # index.html names those hashed files, so it must be revalidated on every
    # load. Cached, it survives a deploy and keeps pointing at chunk filenames
    # the server no longer has — the browser then fails to load a lazily
    # imported route and the page comes up blank until a manual refresh.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Serve the built SPA and fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend so the browser sees one origin.
    #
    # The Go router serves its routes at the root (/auth/..., /healthz,
    # /public/..., /work-orders, etc.) with no /api prefix, so the /api prefix
    # is stripped before forwarding: /api/auth/login reaches the backend as
    # /auth/login. The frontend is built with VITE_IRIS_API_BASE_URL=/api to
    # match. "backend" is the compose service name.
    #
    # The upstream host is held in a variable and resolved per request through
    # Docker's embedded DNS, rather than written literally into proxy_pass.
    # With a literal name, nginx resolves it once while reading the config and
    # exits with "host not found in upstream" if the backend container is not
    # running at that moment — and then this container, which also serves the
    # static SPA, is gone too. depends_on does not prevent that: it orders the
    # first start only, so after a host reboot or a backend crash-loop the
    # Docker restart policy can start this container first. The whole domain
    # then refuses connections, which upstream (Caddy) turns into a hanging
    # request and an uptime monitor reports as a timeout with no status code.
    # Resolving per request also means a recreated backend's new container IP
    # is picked up within `valid`, instead of nginx proxying to a dead address
    # until someone restarts it.
    #
    # $iris_backend_uri rebuilds the backend path from the raw $request_uri
    # (query string included), because proxy_pass does not strip the location
    # prefix itself once it contains a variable.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        # Never let name resolution be the thing that hangs a request: the
        # default resolver_timeout is 30s.
        resolver_timeout 3s;

        set $iris_backend backend;
        proxy_pass http://$iris_backend:8080$iris_backend_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Fail fast instead of holding the connection open. Without these,
        # nginx waits out its 60s defaults on an unreachable backend, so a
        # browser (and the uptime check) sees a stalled request rather than an
        # error. The read timeout stays above the backend's own 30s
        # WriteTimeout so a slow PDF render still finishes.
        proxy_connect_timeout 3s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }
}
