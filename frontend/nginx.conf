# Compress everything text-shaped on the way out. The Hetzner deploy also has
# Caddy in front (which compresses too, and passes an already-compressed
# response straight through), but the LAN deploy in deploy/docker-compose.yml
# publishes this nginx directly on port 80 with nothing in front of it — there
# this is the only compression the browser gets. The built bundle is ~1.5 MB
# uncompressed against ~0.44 MB gzipped.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;

    root /usr/share/nginx/html;

    # Vite emits every asset with a content hash in its filename, so a changed
    # file always ships under a new name and these can be cached permanently.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # index.html names those hashed files, so it must be revalidated on every
    # load. Cached, it survives a deploy and keeps pointing at chunk filenames
    # the server no longer has — the browser then fails to load a lazily
    # imported route and the page comes up blank until a manual refresh.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Serve the built SPA and fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend so the browser sees one origin.
    #
    # The Go router serves its routes at the root (/auth/..., /healthz,
    # /public/..., /work-orders, etc.) with no /api prefix. The trailing slash
    # on proxy_pass below strips the /api/ prefix before forwarding, so a
    # browser request to /api/auth/login reaches the backend as /auth/login.
    # The frontend is built with VITE_IRIS_API_BASE_URL=/api to match.
    # "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
