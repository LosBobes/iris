# Production compose for the Iris stack on a shared Hetzner host.
#
# This mirrors how gamgee is deployed on the same box: a host-level Caddy
# terminates TLS (Let's Encrypt) and reverse-proxies each domain to a
# loopback-only port. gamgee owns localhost:3000; Iris owns localhost:3001,
# so the two stacks never collide.
#
# Only the frontend is published, and only on 127.0.0.1 — so nothing here is
# reachable from the internet except through Caddy. The Go backend and the
# SQLite volume stay on Iris's private compose network.
#
# Images are BUILT IN CI (.github/workflows/build.yml) and pulled from GHCR,
# not built on this box. Building here meant every deploy ran `npm ci`, a Vite
# build and a Go build on the same two shared cores that serve Iris and gamgee,
# so the app got slow or unresponsive for the length of the build.
#
# `image:` is what the server uses. The `build:` blocks are kept so that
# `docker compose -f docker-compose.prod.yml build` still works from a clean
# checkout (local troubleshooting, or a manual rebuild if GHCR is unreachable).
# IRIS_IMAGE_TAG pins the release: the deploy workflow sets it to git-<sha7> so
# a deploy is immutable and a rollback is just re-running with an older tag.
#
# Manual `docker compose` commands on the box (migration, rollback, exec) must
# export the RUNNING tag first, or `:latest` (stale locally) is used and the
# stack can be recreated on the wrong image. deploy/POSTGRES.md step 0 has the
# one-liner.

services:
  db:
    # Opt-in. This service only starts when the "postgres" profile is active,
    # which is switched on by putting COMPOSE_PROFILES=postgres in the server's
    # .env at cutover time. That matters because deploy.yml runs a plain
    # `docker compose up -d` on every merge to main: until an operator has
    # actually migrated, merging this must change nothing on the box.
    profiles: ["postgres"]
    # Debian-based rather than -alpine on purpose: the schema creates an ICU
    # collation ("nocase") for the case-insensitive ordering and lookups the
    # store relies on, and the Debian image ships ICU without extra packages.
    # Pinned to a minor so routine deploys (a plain `compose up -d`) never
    # recreate the database container on a new image; bump it deliberately
    # (pg_dump first). Do NOT move to Postgres 18: its image keeps data under a
    # different path than the volume mounted below. See deploy/POSTGRES.md.
    image: "postgres:16.15"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-iris}"
      POSTGRES_USER: "${POSTGRES_USER:-iris}"
      # Not `:?` — compose interpolates the whole file before it filters by
      # profile, so a required variable here would break every deploy that has
      # not opted in yet. Unset simply means the container refuses to
      # initialise, which is only reachable once the profile is on.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      # Keeps the on-disk encoding/collation predictable regardless of the
      # host locale, so a restore onto another box compares strings the same way.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    # Internal only. Postgres is never published to the host, let alone the
    # internet; the backend reaches it over the compose network.
    expose:
      - "5432"
    volumes:
      - iris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iris} -d ${POSTGRES_DB:-iris}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    image: "ghcr.io/losbobes/iris-backend:${IRIS_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Deliberately no depends_on for db: it lives behind a compose profile, and
    # depending on it would drag it into every deploy. `restart: unless-stopped`
    # covers the boot-ordering case — if Postgres is not up yet, the API exits
    # and is restarted until it connects.
    environment:
      IRIS_ENV: "${IRIS_ENV:-production}"
      # Empty by default, which means SQLite. Set it in the server's .env only
      # AFTER the data has been copied across (deploy/POSTGRES.md):
      #   DATABASE_URL=postgres://iris:<password>@db:5432/iris?sslmode=disable
      # Clearing it again is the rollback: the SQLite volume below is retained
      # and the migration only ever read from it.
      # Never deploy an image older than the Postgres support (PR #46) while this
      # is set: it ignores the variable and silently serves SQLite instead.
      DATABASE_URL: "${DATABASE_URL:-}"
      DATABASE_PATH: "/data/iris.db"
      # Same-origin: the browser hits Caddy -> nginx -> /api/, so no
      # cross-origin allow-list is needed.
      IRIS_ALLOWED_ORIGINS: "${IRIS_ALLOWED_ORIGINS:-}"
      # Optional release identifier shown in Sentry (e.g. the git sha).
      IRIS_RELEASE: "${IRIS_RELEASE:-}"
      # SQLite backups (ignored with DATABASE_URL) (Backoffice "Sistem" tab). Copies go to /data/backups on
      # the data volume; empty values take the defaults (keep 14, warn after
      # 24 h). IRIS_BACKUP_INTERVAL (e.g. 24h) turns on automatic copies.
      IRIS_BACKUP_DIR: "${IRIS_BACKUP_DIR:-}"
      IRIS_BACKUP_KEEP: "${IRIS_BACKUP_KEEP:-}"
      IRIS_BACKUP_INTERVAL: "${IRIS_BACKUP_INTERVAL:-}"
      IRIS_BACKUP_STALE_HOURS: "${IRIS_BACKUP_STALE_HOURS:-}"
      # Passwords for the optional demo organization (/login/demo), read by
      # `irisctl seed-demo` run inside this container. Required to seed it in
      # production (12+ characters, not the public demo passwords); the demo org
      # is created only when you run seed-demo, never on start. Kept in the
      # server's .env (gitignored), never committed.
      IRIS_DEMO_ADMIN_PASSWORD: "${IRIS_DEMO_ADMIN_PASSWORD:-}"
      IRIS_DEMO_OPERATOR_PASSWORD: "${IRIS_DEMO_OPERATOR_PASSWORD:-}"
      # Prefix for the demo fixture record ids, needed when another tenant in the
      # same database already uses the fixed fixture ids (e.g. the real Čobanović
      # data, whose customers are also cust-N). Read by seed-demo only.
      IRIS_DEMO_ID_PREFIX: "${IRIS_DEMO_ID_PREFIX:-}"
    # Internal only: never published to the host. nginx (frontend) reaches it
    # over the compose network on this port.
    expose:
      - "8080"
    volumes:
      # SQLite database persists here. Survives every rebuild/recreate; only
      # `docker compose down -v` would delete it.
      - iris_sqlite_data:/data
    healthcheck:
      # frontend waits on this check before it starts, so the interval is the
      # floor on deploy downtime: at 30s a recreate blacked the site out for
      # half a minute even though the API was up in well under a second. It is
      # also pure latency — the API is serving before Docker asks — so it is
      # polled at 1s. Measured on deploy run 35, at 2s the gate took 5.6s of
      # the 5.9s the site spent unreachable; the rest is the container start
      # itself. What matters is that the total stays inside the window Caddy
      # retries across (Caddyfile), or a deploy shows up as 502s. The check is
      # a local wget against an in-process handler, so polling it this often
      # costs nothing.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 5
      start_period: 30s

  frontend:
    image: "ghcr.io/losbobes/iris-frontend:${IRIS_IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # Ordering for `compose up` only. It is NOT honoured when the Docker
    # daemon restarts the stack itself (a host reboot), where the restart
    # policy can start this container before the backend exists — so nginx
    # must not depend on the backend being resolvable at startup. It doesn't:
    # see the resolver comment in frontend/nginx.conf.
    depends_on:
      backend:
        condition: service_healthy
    # Loopback only — reachable from Caddy on the same host, not the internet.
    # gamgee uses 3000; Iris uses 3001.
    ports:
      - "127.0.0.1:3001:80"
    environment:
      # Caddy's loopback connection reaches nginx from this network's gateway
      # (Docker's port proxy / NAT), so that one address, and only it, may
      # supply the client address via X-Forwarded-For (frontend/iris-real-ip.sh).
      # Must match the gateway pinned under `networks:` below.
      IRIS_TRUSTED_PROXY: "${IRIS_TRUSTED_PROXY:-172.31.253.1}"

# The default network's subnet and gateway are pinned so the trusted proxy
# above is one fixed address rather than all of 172.16.0.0/12. If this subnet
# ever collides with another network on the host, change both together (and
# IRIS_TRUSTED_PROXY in .env if it overrides the default). Compose recreates
# the network on the next `up -d` when this changes.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.253.0/24
          gateway: 172.31.253.1

volumes:
  # Retained after the Postgres migration: it holds the pre-migration database
  # and is what a rollback (unset DATABASE_URL) reads from. Safe to remove once
  # Postgres has been running long enough that you no longer want that option.
  iris_sqlite_data:
  iris_postgres_data:
